</style></head><body><main><header class="head"><h1>色をぬった長さを分数で表そう</h1><p>色をぬった部分の長さを、仮分数と帯分数の両方で表しましょう。</p></header><section id="quiz"><div class="status"><span id="progress">1問目／10問</span><span id="score">正解 0問</span></div><div class="track"><span id="bar"></span></div><h2 class="prompt">色をぬった部分の長さは何mですか？</h2><article class="card"><div class="svg-wrap"><svg id="diagram" class="diagram" viewBox="0 0 700 185" role="img" aria-label="色をぬった長さの図"></svg></div><div class="answers"><div class="answer-card"><p class="answer-title">帯分数</p><div class="equation"><input id="mixedWhole" class="answer-input whole" inputmode="numeric" maxlength="2" aria-label="帯分数の整数部分"><span class="fraction"><input id="mixedNum" class="answer-input" inputmode="numeric" maxlength="2" aria-label="帯分数の分子"><span class="frac-line"></span><input id="mixedDen" class="answer-input" inputmode="numeric" maxlength="2" aria-label="帯分数の分母"></span><span class="unit">m</span></div></div><div class="answer-card"><p class="answer-title">仮分数</p><div class="equation"><span class="fraction"><input id="improperNum" class="answer-input" inputmode="numeric" maxlength="2" aria-label="仮分数の分子"><span class="frac-line"></span><input id="improperDen" class="answer-input" inputmode="numeric" maxlength="2" aria-label="仮分数の分母"></span><span class="unit">m</span></div></div></div></article><p id="feedback" class="feedback" role="status" aria-live="polite"></p><p id="hint" class="hint" aria-live="polite"></p><div class="actions"><button id="check" class="btn" type="button">答え合わせ</button><button id="next" class="btn" type="button">次の問題へ</button></div></section><section id="finish" class="finish"><h2>よくがんばりました！</h2><p id="final"></p><button id="again" class="btn" type="button">もう一度チャレンジ</button><p class="small">問題の順番を入れ替えて、もう一度取り組めます。</p></section></main><script>
(()=>{'use strict';
const bank=[
 {u:2,d:3,k:4},
 {u:3,d:2,k:5},
 {u:2,d:4,k:5},
 {u:3,d:5,k:12},
 {u:2,d:6,k:8},

 {u:3,d:6,k:14}
];const ids=['mixedWhole','mixedNum','mixedDen','improperNum','improperDen'];const focusOrder=['mixedWhole','mixedDen','mixedNum','improperDen','improperNum'];const $=id=>document.getElementById(id);let questions=[],index=0,score=0,firstTry=true,solved=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(q){const svg=$('diagram'),unit=180,x0=80,barY=24,barH=42,lineY=112,end=x0+q.u*unit,whole=Math.floor(q.k/q.d),rem=q.k%q.d,den=q.d;svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${end+80} 185`);const NS='http://www.w3.org/2000/svg';function el(tag,attrs={},text=''){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;svg.append(e);return e}for(let j=0;j<q.u*q.d;j++){const x=x0+j*unit/q.d;el('rect',{x,y:barY,width:unit/q.d,height:barH,fill:j<q.k?'#f6d9d5':'#fff',stroke:'#27384a','stroke-width':'1.7'})}el('line',{x1:x0,y1:lineY,x2:end+38,y2:lineY,stroke:'#27384a','stroke-width':'4'});for(let j=0;j<=q.u*q.d;j++){const x=x0+j*unit/q.d,unitMark=j%q.d===0;el('line',{x1:x,y1:barY,x2:x,y2:barY+barH,stroke:'#27384a','stroke-width':unitMark?'1.8':'1.2','stroke-dasharray':unitMark?'':'4 3'});if(unitMark){const n=j/q.d;el('line',{x1:x,y1:lineY-10,x2:x,y2:lineY+9,stroke:'#27384a','stroke-width':'1.8'});el('text',{x,y:lineY+42,'text-anchor':'middle','font-size':'22',fill:'#24476b','font-family':'GenJyuuGothicX-Bold,Yu Gothic,sans-serif'},String(n))}}el('text',{x:end+51,y:lineY+42,'font-size':'18',fill:'#24476b','font-family':'GenJyuuGothicX-Bold,Yu Gothic,sans-serif'},'(m)');svg.setAttribute('aria-label',`0から${q.u}mまでの目盛りを${q.d}等分し、${q.k}こ分を色ぬりした図`)}
function render(){if(index>=questions.length){finish();return}const q=questions[index];firstTry=true;solved=false;$('progress').textContent=`${index+1}問目／10問`;$('score').textContent=`正解 ${score}問`;$('bar').style.width=`${index*10}%`;draw(q);ids.forEach(id=>{$(id).value='';$(id).disabled=false});$('feedback').textContent='';$('feedback').className='feedback';$('hint').textContent='';$('hint').style.display='none';$('check').style.display='inline-block';$('next').style.display='none';$('next').textContent=index===9?'結果を見る':'次の問題へ';$('mixedWhole').focus()}
function check(){if(solved)return;const vals=ids.map(id=>$(id).value.trim());if(vals.some(v=>!/^\d+$/.test(v))){$('feedback').className='feedback try';$('feedback').textContent='5つの□に数字を入れてください。';const missing=focusOrder.find(id=>!/^\d+$/.test($(id).value.trim()));$(missing).focus();return}const q=questions[index],whole=Math.floor(q.k/q.d),rem=q.k%q.d,mw=Number(vals[0]),mn=Number(vals[1]),md=Number(vals[2]),inN=Number(vals[3]),inD=Number(vals[4]),ok=md>0&&inD>0&&mn<md&&inN>=inD&&(mw*md+mn)*q.d===q.k*md&&inN*q.d===q.k*inD;if(ok){solved=true;if(firstTry)score++;$('score').textContent=`正解 ${score}問`;$('bar').style.width=`${(index+1)*10}%`;$('feedback').className='feedback good';$('feedback').textContent='正解！両方の表し方ができました。';$('hint').textContent=`${whole} ${rem}/${q.d} m ＝ ${q.k}/${q.d} m`;$('hint').style.display='block';ids.forEach(id=>$(id).disabled=true);$('check').style.display='none';$('next').style.display='inline-block';$('next').focus()}else{firstTry=false;$('feedback').className='feedback try';$('feedback').textContent='色の部分の区切り数を数えて、もう一度見直しましょう。';$('hint').style.display='none'}}
function finish(){$('quiz').style.display='none';$('finish').style.display='block';$('final').textContent=`最初の答え合わせで正解 ${score}問／10問`}
function restart(){questions=shuffle(bank.slice());index=0;score=0;$('quiz').style.display='block';$('finish').style.display='none';render()}
focusOrder.forEach((id,i)=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(i<focusOrder.length-1)$(focusOrder[i+1]).focus();else $('check').focus()}}));$('check').addEventListener('click',check);$('next').addEventListener('click',()=>{if(solved){index++;render()}});$('again').addEventListener('click',restart);restart();
})();</script></body></html>
