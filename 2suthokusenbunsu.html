:root{--cream:#fffdf7;--navy:#24476b;--blue:#8eb9e9;--pale:#eef6ff;--orange:#f5a343;--green:#35825f;--red:#c8525f}*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:"GenJyuuGothicX-Bold","Yu Gothic",Meiryo,sans-serif;font-weight:700;background-color:var(--cream);background-image:linear-gradient(to bottom,transparent 39px,rgba(139,188,233,.14) 40px);background-size:100% 40px}main{width:min(900px,100%);margin:auto;padding:20px}.head{text-align:center}.head h1{font-size:clamp(25px,4.6vw,36px);line-height:1.3;margin:0 0 5px}.head p{font-size:clamp(15px,2.6vw,19px);color:#527292;margin:0 0 16px}.status{display:flex;justify-content:space-between;font-size:17px;margin-bottom:7px}.track{height:10px;background:#e1ebf6;border-radius:12px;overflow:hidden;margin-bottom:15px}.track span{display:block;height:100%;width:0;background:var(--orange);transition:width .2s}.prompt{text-align:center;font-size:clamp(18px,3.2vw,23px);margin:0 0 12px}.card{background:rgba(238,246,255,.94);border:2px dashed #b7d5fb;border-radius:18px;padding:clamp(12px,3vw,22px)}.svg-wrap{width:min(100%,760px);margin:0 auto}.diagram{display:block;width:100%;height:auto}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px auto 0;max-width:760px}.answers.one{grid-template-columns:minmax(210px,340px);justify-content:center}.answer-card{background:#fff;border:2px solid var(--blue);border-radius:14px;padding:12px 10px;text-align:center}.answer-title{font-size:18px;color:#527292;margin:0 0 8px}.equation{display:flex;align-items:center;justify-content:center;gap:8px;font-size:19px}.whole{width:64px}.fraction{display:inline-grid;grid-template-rows:auto 2px auto;min-width:58px;align-items:center;justify-items:stretch;gap:3px}.fraction input{width:100%}.frac-line{height:2px;background:var(--navy);width:100%}.answer-input{height:47px;border:2px solid var(--blue);border-radius:9px;background:#fff;color:var(--navy);text-align:center;font:700 23px "GenJyuuGothicX-Bold","Yu Gothic",Meir </style></head><body><main><header class="head"><h1>数直線の目盛りを分数で表そう</h1><p>1より大きい分数は、仮分数と帯分数の両方で表しましょう。</p></header><section id="quiz"><div class="status"><span id="progress">1問目／10問</span><span id="score">正解 0問</span></div><div class="track"><span id="bar"></span></div><h2 id="prompt" class="prompt"></h2><article class="card"><div class="svg-wrap"><svg id="diagram" class="diagram" viewBox="0 0 700 250" role="img" aria-label="0から3までの数直線"></svg></div><div id="answers" class="answers"><div id="properCard" class="answer-card"><p class="answer-title">分数</p><div class="equation"><span class="fraction"><input id="properNum" class="answer-input" inputmode="numeric" maxlength="2" aria-label="分子"><span class="frac-line"></span><input id="properDen" class="answer-input" inputmode="numeric" maxlength="2" aria-label="分母"></span></div></div><div id="mixedCard" class="answer-card"><p class="answer-title">帯分数</p><div class="equation"><input id="mixedWhole" class="answer-input whole" inputmode="numeric" maxlength="2" aria-label="帯分数の整数部分"><span class="fraction"><input id="mixedNum" class="answer-input" inputmode="numeric" maxlength="2" aria-label="帯分数の分子"><span class="frac-line"></span><input id="mixedDen" class="answer-input" inputmode="numeric" maxlength="2" aria-label="帯分数の分母"></span></div></div><div id="improperCard" class="answer-card"><p class="answer-title">仮分数</p><div class="equation"><span class="fraction"><input id="improperNum" class="answer-input" inputmode="numeric" maxlength="2" aria-label="仮分数の分子"><span class="frac-line"></span><input id="improperDen" class="answer-input" inputmode="numeric" maxlength="2" aria-label="仮分数の分母"></span></div></div></div></article><p id="feedback" class="feedback" role="status" aria-live="polite"></p><p id="hint" class="hint" aria-live="polite"></p><div class="actions"><button id="check" class="btn" type="button">答え合わせ</button><button id="next" class="btn" type="button">次の問題へ</button></div></section><section id="finish" class="finish"><h2>よくがんばりました！</h2><p id="final"></p><button id="again" class="btn" type="button">もう一度チャレンジ</button><p class="small">問題の順番を入れ替えて、もう一度取り組めます。</p></section></main><script>
(()=>{'use strict';

function draw(q){const svg=$('diagram'),x0=35,x1=665,y=144,step=(x1-x0)/24;svg.replaceChildren();const NS='http://www.w3.org/2000/svg';function el(tag,attrs={},txt=''){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt)e.textContent=txt;svg.append(e);return e}el('line',{x1:x0,y1:y,x2:x1,y2:y,stroke:'#242424','stroke-width':'5'});for(let i=0;i<=24;i++){const x=x0+i*step,major=i%8===0;el('line',{x1:x,y1:y-(major?30:12),x2:x,y2:y+(major?8:0),stroke:'#242424','stroke-width':major?'2.4':'1.5'});if(major)el('text',{x,y:y-41,'text-anchor':'middle','font-size':'25',fill:'#111','font-family':'GenJyuuGothicX-Bold,Yu Gothic,sans-serif'},String(i/8))}const x=x0+q.n*step;el('path',{d:`M${x} ${y+3} L${x-7} ${y+17} L${x-3} ${y+17} L${x-3} ${y+42} L${x+3} ${y+42} L${x+3} ${y+17} L${x+7} ${y+17} Z`,fill:'#888'});svg.setAttribute('aria-label','0から3までを8等分した数直線上の目盛り')}
function render(){if(index>=questions.length){finish();return}const q=questions[index],greater=q.n>q.denom;firstTry=true;solved=false;$('progress').textContent=`${index+1}問目／10問`;$('score').textContent=`正解 ${score}問`;$('bar').style.width=`${index*10}%`;$('prompt').textContent='矢印の目盛りが表す分数を答えましょう。';draw(q);$('properCard').style.display=greater?'none':'block';$('mixedCard').style.display=greater?'block':'none';$('improperCard').style.display=greater?'block':'none';$('answers').className=greater?'answers':'answers one';ids.forEach(id=>{$(id).value='';$(id).disabled=false;$(id).closest('.answer-card').style.display=($(id).id==='properNum'||$(id).id==='properDen')?!greater:greater?'block':'none'});$('feedback').textContent='';$('feedback').className='feedback';$('hint').textContent='';$('hint').style.display='none';$('check').style.display='inline-block';$('next').style.display='none';$('next').textContent=index===9?'結果を見る':'次の問題へ';$(greater?'mixedWhole':'properDen').focus()}
function check(){if(solved)return;const q=questions[index],greater=q.n>q.denom,order=greater?focusMixed:focusProper,vals=order.map(id=>$(id).value.trim());if(vals.some(v=>!/^\d+$/.test(v))){$('feedback').className='feedback try';$('feedback').textContent='□に数字を入れてください。';const missing=order.find(id=>!/^\d+$/.test($(id).value.trim()));$(missing).focus();return}let ok=false;if(greater){const [w,den,num,inDen,inNum]=vals.map(Number);ok=den>0&&inDen>0&&num<den&&inNum>=inDen&&(w*den+num)*q.denom===q.n*den&&inNum*q.denom===q.n*inDen}else{const [den,num]=vals.map(Number);ok=den>0&&num<den&&num*q.denom===q.n*den}if(ok){solved=true;if(firstTry)score++;$('score').textContent=`正解 ${score}問`;$('bar').style.width=`${(index+1)*10}%`;$('feedback').className='feedback good';$('feedback').textContent='正解！目盛りを分数で表せました。';$('hint').textContent=greater?`${Math.floor(q.n/q.denom)} ${q.n%q.denom}/${q.denom} ＝ ${q.n}/${q.denom}`:`${q.n}/${q.denom}`;$('hint').style.display='block';ids.forEach(id=>$(id).disabled=true);$('check').style.display='none';$('next').style.display='inline-block';$('next').focus()}else{firstTry=false;$('feedback').className='feedback try';$('feedback').textContent='目盛りの間の数を数えて、もう一度見直しましょう。';$('hint').style.display='none'}}
function finish(){$('quiz').style.display='none';$('finish').style.display='block';$('final').textContent=`最初の答え合わせで正解 ${score}問／10問`}
function restart(){questions=shuffle(bank.slice());index=0;score=0;$('quiz').style.display='block';$('finish').style.display='none';render()}
[...focusProper,...focusMixed].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const q=questions[index],order=q.n>q.denom?focusMixed:focusProper,i=order.indexOf(id);if(i<order.length-1)$(order[i+1]).focus();else $('check').focus()}}));$('check').addEventListener('click',check);$('next').addEventListener('click',()=>{if(solved){index++;render()}});$('again').addEventListener('click',restart);restart();
})();</script></body></html>
