function draw(q){const svg=$('diagram'),x0=105,top=66,height=178,bottom=top+height,w=150;svg.replaceChildren();svg.setAttribute('viewBox','0 0 700 270');const NS='http://www.w3.org/2000/svg';function el(tag,attrs={},txt=''){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt)e.textContent=txt;svg.append(e);return e}function vessel(x,filled,d){const level=top+height*(1-filled);el('rect',{x:x+4,y:level,width:w-8,height:bottom-level,fill:'#adddf4'});el('path',{d:`M${x} ${top} V${bottom} H${x+w} V${top}`,fill:'none',stroke:'#222','stroke-width':'5','stroke-linejoin':'round'});el('line',{x1:x+3,y1:top,x2:x+30,y2:top,stroke:'#222','stroke-width':'5'});el('line',{x1:x+w-30,y1:top,x2:x+w-3,y2:top,stroke:'#222','stroke-width':'5'});el('text',{x:x+w/2,y:top-16,'text-anchor':'middle','font-size':'24',fill:'#111','font-family':'GenJyuuGothicX-Bold,Yu Gothic,sans-serif'},'1 L');for(let i=1;i<d;i++){const y=top+height*i/d;el('line',{x1:x+2,y1:y,x2:x+18,y2:y,stroke:'#222','stroke-width':'2.4'})}el('path',{d:`M${x} ${top} V${bottom} H${x+w} V${top}`,fill:'none',stroke:'#222','stroke-width':'5','stroke-linejoin':'round'})}vessel(x0,1,q.d);vessel(420,q.k/q.d,q.d);svg.setAttribute('aria-label',`1Lの容器が満水で、もう1つは${q.k}/${q.d}まで水が入った図`)}
function render(){if(index>=questions.length){finish();return}const q=questions[index];firstTry=true;solved=false;$('progress').textContent=`${index+1}問目／10問`;$('score').textContent=`正解 ${score}問`;$('bar').style.width=`${index*10}%`;draw(q);ids.forEach(id=>{$(id).value='';$(id).disabled=false});$('feedback').textContent='';$('feedback').className='feedback';$('hint').textContent='';$('hint').style.display='none';$('check').style.display='inline-block';$('next').style.display='none';$('next').textContent=index===9?'結果を見る':'次の問題へ';$('mixedWhole').focus()}

function finish(){$('quiz').style.display='none';$('finish').style.display='block';$('final').textContent=`最初の答え合わせで正解 ${score}問／10問`}
function restart(){questions=shuffle(bank.slice());index=0;score=0;$('quiz').style.display='block';$('finish').style.display='none';render()}
