:root{--cream:#fffdf7;--navy:#24476b;--blue:#8eb9e9;--pale:#eef6ff;--orange:#f5a343;--green:#35825f;--red:#c8525f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:repeating-linear-gradient(0deg,var(--cream) 0 39px,#e8f1f8 40px 41px);color:var(--navy);font-family:"GenJyuuGothicX-Bold","Yu Gothic",Meiryo,sans-serif;font-weight:700}
main{width:min(900px,100%);margin:auto;padding:clamp(14px,3vw,28px)}header{text-align:center;margin:0 auto 18px}h1{font-size:clamp(23px,4vw,34px);margin:4px 0 4px}header p{margin:0;color:#58799c;font-size:clamp(15px,2.5vw,20px)}
.status{display:flex;justify-content:space-between;align-items:center;font-size:clamp(14px,2vw,18px);margin:10px 0 8px}.track{height:10px;border-radius:10px;background:#d8e8f7;overflow:hidden}.track span{display:block;height:100%;width:0;background:var(--orange);transition:width .2s}
.card{background:rgba(238,246,255,.94);border:2px solid #b7d2f2;border-radius:22px;padding:clamp(16px,4vw,36px) clamp(12px,3vw,26px);margin-top:18px;text-align:center}.problem{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.1vw,22px);white-space:nowrap;font-size:clamp(34px,8vw,68px);line-height:1.15;min-height:120px}.mixed{display:inline-flex;align-items:center;gap:.05em}.whole{font-size:1em}.frac{display:inline-grid;grid-template-rows:1fr 3px 1fr;align-items:center;justify-items:center;line-height:1.02;min-width:.83em}.frac .bar{width:100%;height:3px;background:currentColor}.operator{font-size:.82em}
.answer-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto 8px}.answer-whole{width:clamp(60px,14vw,90px);height:clamp(60px,14vw,90px);font-size:clamp(30px,6vw,46px);border:2px solid var(--blue);border-radius:14px;text-align:center;color:var(--navy);background:white;font-family:inherit}.answer-frac{display:grid;grid-template-rows:clamp(49px,11vw,66px) 3px clamp(49px,11vw,66px);width:clamp(60px,14vw,90px)}.answer-frac input{width:100%;min-width:0;text-align:center;border:2px solid var(--blue);border-radius:12px;background:white;color:var(--navy);font-size:clamp(26px,5vw,38px);font-family:inherit}.answer-frac .bar{height:3px;background:var(--navy);margin:3px 0}.answer-frac input:focus,.answer-whole:focus{outline:4px solid #ffd08d;border-color:var(--orange)}
.buttons{display:flex;justify-content:center;gap:12px;margin-top:20px}.btn{border:0;border-radius:14px;padding:13px 26px;font:inherit;font-size:clamp(17px,2.6vw,21px);cursor:pointer}.primary{background:#397fc3;color:white;box-shadow:0 4px #225783}.secondary{background:#e4f0fc;color:var(--navy);border:2px solid var(--blue)}.feedback{min-height:34px;margin:14px 0 0;font-size:clamp(16px,2.6vw,20px)}.good{color:var(--green)}.try{color:var(--red)}.small{color:#58799c;font-size:14px;margin-top:8px}.hidden{display:none!important}
#finish{text-align:center;padding:30px 12px}#final{font-size:clamp(26px,5vw,40px);margin:15px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:520px){main{padding:12px}.card{border-radius:16px}.problem{min-height:92px}.buttons{gap:9px}.btn{padding:12px 18px}}
</style></head><body><main><header><h1>分数のひき算</h1><p>答えを入力しましょう。</p></header>
<section id="quiz"><div class="status"><span id="progress">1問目／10問</span><span id="score">正解 0問</span></div><div class="track"><span id="bar"></span></div>
<div class="card"><div id="problem" class="problem" aria-live="polite"></div><div class="answer-row" aria-label="答え">
<input id="whole" class="answer-whole" type="text" inputmode="numeric" aria-label="整数" autocomplete="off" tabindex="1">
<div class="answer-frac"><input id="num" type="text" inputmode="numeric" aria-label="分子" autocomplete="off" tabindex="3"><span class="bar"></span><input id="den" type="text" inputmode="numeric" aria-label="分母" autocomplete="off" tabindex="2"></div></div>
<div class="small">入力して「答え合わせ」を押します</div><div id="feedback" class="feedback" aria-live="polite"></div>
<div class="buttons"><button id="check" class="btn primary">答え合わせ</button><button id="next" class="btn secondary hidden">つぎへ</button></div></div></section>
<section id="finish" class="card hidden"><h2>よくがんばりました！</h2><div id="final"></div><button id="again" class="btn primary">もう一度</button></section></main>
<script>
const bank=[
 {a:{w:2,n:3,d:4},b:{w:1,n:1,d:4}},
 {a:{w:3,n:5,d:6},b:{w:1,n:2,d:6}},
 {a:{w:1,n:4,d:5},b:{w:0,n:2,d:5}},
 {a:{w:4,n:2,d:3},b:{w:2,n:0,d:3}},
 {a:{w:3,n:2,d:5},b:{w:0,n:4,d:5}},
 {a:{w:1,n:3,d:6},b:{w:0,n:5,d:6}},
 {a:{w:2,n:0,d:3},b:{w:0,n:1,d:3}},
 {a:{w:3,n:0,d:4},b:{w:0,n:2,d:4}},
 {a:{w:2,n:1,d:4},b:{w:0,n:3,d:4}},
 {a:{w:3,n:4,d:5},b:{w:0,n:2,d:5}}
];
const $=id=>document.getElementById(id);let questions=[],index=0,score=0,done=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function frac(n,d){return `<span class="frac"><span>${n}</span><span class="bar"></span><span>${d}</span></span>`}
function term(x){return `<span class="mixed">${x.w?`<span class="whole">${x.w}</span>`:''}${x.n?frac(x.n,x.d):''}</span>`}
function result(q){const total=q.a.w*q.a.d+q.a.n-q.b.w*q.a.d-q.b.n;return {n:total,d:q.a.d}}
function render(){if(index>=questions.length){finish();return}done=false;const q=questions[index];$('progress').textContent=`${index+1}問目／${questions.length}問`;$('score').textContent=`正解 ${score}問`;$('bar').style.width=`${index/questions.length*100}%`;$('problem').innerHTML=`${term(q.a)}<span class="operator">−</span>${term(q.b)}<span class="operator">＝</span>`;['whole','den','num'].forEach(id=>$(id).value='');$('feedback').textContent='';$('feedback').className='feedback';$('check').classList.remove('hidden');$('next').classList.add('hidden');$('whole').focus()}
function check(){if(done)return;const q=questions[index],w=$('whole').value.trim(),d=$('den').value.trim(),n=$('num').value.trim();if(!w&&!d&&!n){$('feedback').textContent='答えを入力しましょう。';$('feedback').className='feedback try';$('whole').focus();return}if((d&&!n)||(!d&&n)|| (d&&Number(d)===0) || (w&&!/^\d+$/.test(w)) || (d&&!/^\d+$/.test(d)) || (n&&!/^\d+$/.test(n))){$('feedback').textContent='整数・分母・分子を確かめましょう。';$('feedback').className='feedback try';return}
 const ans=result(q),expectedWhole=Math.floor(ans.n/ans.d),expectedNum=ans.n%ans.d;const correct=Number(w||0)===expectedWhole&&(expectedNum===0?!d&&!n:Number(d)===ans.d&&Number(n)===expectedNum);
 if(correct){score++;$('score').textContent=`正解 ${score}問`;$('feedback').textContent='できた！';$('feedback').className='feedback good';done=true;$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').focus()}else{$('feedback').textContent='もう一度見直しましょう。';$('feedback').className='feedback try';$('whole').focus()}}
function finish(){$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('final').textContent=`正解 ${score}問／${questions.length}問`}
function restart(){questions=shuffle(bank.slice());index=0;score=0;$('quiz').classList.remove('hidden');$('finish').classList.add('hidden');render()}
$('check').addEventListener('click',check);$('next').addEventListener('click',()=>{if(done){index++;render()}});$('again').addEventListener('click',restart);
$('whole').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('den').focus()}});$('den').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('num').focus()}});$('num').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
questions=shuffle(bank.slice());render();
</script></body></html>
