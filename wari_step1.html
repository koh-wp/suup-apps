<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>わり算マスター STEP1</title>
<style>
:root{--navy:#315f7d;--blue:#6fa8d8;--sky:#f0f6fb;--yellow:#e9a747;--green:#2f9b6a;--red:#d95f5f;--ink:#294f6b;--muted:#66809a;--card:#fffdf7;--shadow:0 12px 35px rgba(49,95,125,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--ink)}
body{background-color:#fffaf0;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(111,168,216,.22) 32px,transparent 33px);display:grid;place-items:center;padding:16px;overflow-x:hidden}
button,input{font:inherit}.app{width:min(760px,100%);min-height:min(700px,calc(100vh - 32px));background:rgba(255,253,247,.96);border:3px solid #fff;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;position:relative}
header{height:86px;background:#fffaf0;color:var(--navy);border-bottom:3px solid #d8e9f6;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;gap:12px}.brand{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:.04em}.step{background:var(--yellow);color:#fff;font-weight:900;padding:8px 14px;border-radius:999px;white-space:nowrap}
main{padding:clamp(20px,5vw,38px);text-align:center}.screen{display:none}.screen.active{display:block}.hero-icon{font-size:70px;line-height:1;margin:8px}.lead{font-size:clamp(25px,5vw,38px);font-weight:900;margin:15px 0 8px}.sub{font-size:clamp(16px,2.7vw,20px);color:var(--muted);font-weight:700;line-height:1.7}.rule{margin:25px auto;max-width:520px;background:var(--sky);border:2px solid #cfe2f2;border-radius:18px;padding:16px;font-size:18px;font-weight:800}.progress-box{display:flex;justify-content:center;gap:10px;margin-top:18px}.stamp{width:54px;height:54px;border:3px dashed #9ab0c2;border-radius:50%;display:grid;place-items:center;font-size:27px;color:#9ab0c2;font-weight:900}.stamp.done{border:3px solid var(--green);color:#fff;background:var(--green)}
.primary,.secondary{border:0;border-radius:16px;padding:15px 32px;font-weight:900;font-size:21px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:.08s transform,.08s box-shadow}.primary{background:var(--yellow);color:#fff}.secondary{background:#edf4f9;color:var(--navy);font-size:17px}.primary:active,.secondary:active,.key:active{transform:translateY(4px);box-shadow:none}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:900}.counter,.timer{padding:8px 14px;border-radius:12px;background:#edf4f9;font-size:19px}.timer{font-variant-numeric:tabular-nums}
.bar{height:12px;background:#e2edf5;border-radius:999px;margin:14px 0 32px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#8ac1e8,var(--blue));transition:width .25s}
.prompt{color:var(--muted);font-weight:800;font-size:18px;margin-bottom:12px}.problem{font-family:Arial,"Yu Gothic",sans-serif;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,18px);font-size:clamp(42px,10vw,74px);font-weight:800;white-space:nowrap;margin:10px 0 24px}.answer{width:1.45em;height:1.35em;border:4px solid var(--blue);border-radius:14px;text-align:center;font-size:inherit;font-weight:900;color:var(--navy);background:#fff;outline:none;caret-color:transparent}.answer:focus{box-shadow:0 0 0 6px rgba(111,168,216,.20)}.answer.correct{border-color:var(--green);background:#e9fff5}.answer.wrong{border-color:var(--red);background:#fff0f0;animation:shake .25s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.feedback{height:38px;font-size:22px;font-weight:900}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.keypad{width:min(390px,100%);margin:8px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{min-height:58px;border:0;border-radius:14px;background:#edf4f9;color:var(--navy);font-size:26px;font-weight:900;box-shadow:0 4px 0 #c5d9e8;cursor:pointer}.key.zero{grid-column:2/4}.key.clear{font-size:18px;background:#fff0e7;color:#9d4d19}
.result-score{font-size:clamp(55px,13vw,88px);font-weight:900;color:var(--navy);line-height:1.15;margin:10px}.result-title{font-size:clamp(27px,5vw,38px);font-weight:900;margin:8px}.result-msg{font-size:19px;line-height:1.7;font-weight:700;color:var(--muted);min-height:62px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.tiny{font-size:13px;color:#7b8fa1;margin-top:24px}canvas{position:fixed;inset:0;pointer-events:none;z-index:10}
@media(max-height:720px){.app{min-height:0}header{height:68px}main{padding:15px 24px}.bar{margin-bottom:16px}.problem{margin:4px 0 10px}.key{min-height:46px}.feedback{height:30px}.prompt{margin:0}.keypad{gap:7px}}
@media(max-width:430px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}header{padding:10px 15px}.brand{font-size:21px}.step{font-size:13px}.problem{gap:7px}.keypad{gap:8px}.key{min-height:55px}}

*{font-family:"GenJyuu Gothic X App","GenJyuuGothicX","源柔ゴシックX",Meiryo,sans-serif !important}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:540px;margin:18px auto 12px}.stat-card{background:#eef5fa;border:2px solid #cfe2f2;border-radius:18px;padding:10px 7px;display:flex;flex-direction:column;gap:3px}.stat-card span{font-size:13px;color:#66809a}.stat-card strong{font-size:23px;color:#d1882d}.badge-label{font-weight:900;color:#315f7d;margin-top:15px}.badge-label small{font-weight:700}.earned-points{display:flex;justify-content:center;gap:13px;align-items:center;margin:13px auto;padding:11px 16px;background:#fff5e4;border-radius:18px;width:max-content;max-width:100%;color:#6f5b3d}.earned-points b{font-size:20px;color:#d1882d}.earned-points span{font-weight:800}.history-box{max-width:540px;margin:18px auto 0;padding:14px 16px;background:#fffaf0;border:2px solid #efd39a;border-radius:18px;text-align:left}.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.history-title{font-weight:900;color:#315f7d}.history-list{display:grid;gap:7px}.history-empty{text-align:center;color:#7b8fa1;font-size:14px;padding:5px}.history-row{display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center;font-size:13px;font-weight:800;color:#5d7890}.history-track{height:10px;background:#e1ebf3;border-radius:999px;overflow:hidden}.history-bar{height:100%;background:linear-gradient(90deg,#f2bd6d,var(--yellow));border-radius:999px}.history-value{white-space:nowrap;color:var(--navy);font-variant-numeric:tabular-nums}.text-button{border:0;background:transparent;color:#7b8fa1;font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer;padding:3px}.growth-note{margin-top:6px;color:#d1882d;font-weight:900}@media(max-width:430px){.stats-row{gap:7px}.stat-card strong{font-size:20px}.history-box{padding:12px}.history-row{grid-template-columns:48px 1fr auto;gap:6px;font-size:12px}}

<body>
<canvas id="confetti"></canvas>
<div class="app">
  <header><div class="brand">わり算マスター</div><div class="step">STEP 1</div></header>
  <main>
    <section id="start" class="screen active">
      <div class="hero-icon">🏆</div>
      <div class="lead">九九の逆算マスター</div>
      <div class="sub">□に入る数を、すばやく出そう！</div>
      <div class="rule">30問にチャレンジ！<br><b>27問以上</b>でバッジをゲット</div>
      <div class="stats-row"><div class="stat-card"><span>⭐ 累計正解ポイント</span><strong id="totalPoints">0</strong></div><div class="stat-card"><span>📝 挑戦回数</span><strong id="challengeCount">0回</strong></div><div class="stat-card"><span>🎯 最高正解数</span><strong id="bestScore">-- / 30</strong></div><div class="stat-card"><span>⏱ 最高記録のタイム</span><strong id="bestTime">--:--</strong></div></div>
      <div class="badge-label">27問バッジ <small>（2こでSTEPクリア）</small></div>
      <div class="progress-box"><div id="stamp1" class="stamp">1</div><div id="stamp2" class="stamp">2</div></div>
      <div class="history-box"><div class="history-head"><div class="history-title">📈 これまでの記録</div><button id="clearHistoryBtn" class="text-button">記録を消す</button></div><div id="historyList" class="history-list"></div></div>
      <div style="margin-top:22px"><button id="startBtn" class="primary">チャレンジする</button></div>
      <div class="tiny">正解数を大切にし、タイムは自分の成長記録にします</div>
    </section>

    <section id="quiz" class="screen">
      <div class="topline"><div id="counter" class="counter">1 / 30</div><div id="timer" class="timer">0:00</div></div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="prompt">□に入る数は？</div>
      <div class="problem"><span id="leftNum">7</span><span>×</span><input id="answer" class="answer" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="答え"><span>=</span><span id="product">14</span></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="keypad" aria-label="数字ボタン">
        <button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button>
        <button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button>
        <button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button>
        <button class="key clear" id="clearBtn">けす</button><button class="key zero" data-n="0">0</button>
      </div>
    </section>

    <section id="result" class="screen">
      <div id="resultIcon" class="hero-icon">🎉</div>
      <div id="resultTitle" class="result-title">よくできました！</div>
      <div id="resultScore" class="result-score">30 / 30</div>
      <div id="resultTime" class="sub"></div>
      <div id="resultPoints" class="earned-points"></div>
      <div id="resultMsg" class="result-msg"></div>
      <div id="resultStamps" class="progress-box"></div>
      <div class="actions"><button id="retryBtn" class="primary">もう一度</button><button id="homeBtn" class="secondary">はじめにもどる</button></div>
    </section>
  </main>
</div>
<script>
(()=>{'use strict';
const base=[[7,2],[6,6],[8,4],[3,3],[6,4],[9,1],[6,7],[8,6],[1,1],[5,5],[9,4],[7,5],[8,8],[6,2],[3,1],[7,3],[9,6],[5,4],[3,2],[9,3],[6,5],[4,3],[8,7],[8,5],[9,9],[2,1],[5,2],[7,6],[6,3],[9,8]];
const $=id=>document.getElementById(id), screens=['start','quiz','result'];
let questions=[],index=0,score=0,elapsed=0,timerId=null,locked=false,startedAt=0;
const storePrefix='warizanStep1';
function passes(){return Math.min(2,Number(localStorage.getItem(storePrefix+'Passes')||0))}
function setPasses(n){localStorage.setItem(storePrefix+'Passes',String(Math.min(2,n)))}
function totalPoints(){return Number(localStorage.getItem(storePrefix+'Points')||0)}
function legacyBestSeconds(){return Number(localStorage.getItem(storePrefix+'Best')||0)}
function history(){try{const h=JSON.parse(localStorage.getItem(storePrefix+'History')||'[]');return Array.isArray(h)?h:[]}catch(e){return []}}
function saveHistory(h){localStorage.setItem(storePrefix+'History',JSON.stringify(h.slice(-100)))}
function bestRecord(h){return h.reduce((best,r)=>!best||r.score>best.score||(r.score===best.score&&r.time<best.time)?r:best,null)}
function formatTime(sec){return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function formatDate(iso){const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()}`}
function show(id){screens.forEach(x=>$(x).classList.toggle('active',x===id))}
function drawStamps(where){const n=passes();if(where==='start'){for(let i=1;i<=2;i++)$('stamp'+i).classList.toggle('done',i<=n)}else $('resultStamps').innerHTML=[1,2].map(i=>`<div class="stamp ${i<=n?'done':''}">${i<=n?'✓':i}</div>`).join('')}
function updateHome(){const h=history(),best=bestRecord(h);$('totalPoints').textContent=totalPoints();$('challengeCount').textContent=`${h.length}回`;$('bestScore').textContent=best?`${best.score} / 30`:'-- / 30';$('bestTime').textContent=best?formatTime(best.time):(legacyBestSeconds()?formatTime(legacyBestSeconds()):'--:--');drawStamps('start');$('historyList').innerHTML=h.length?h.slice(-5).reverse().map(r=>`<div class="history-row"><span>${formatDate(r.date)}</span><div class="history-track"><div class="history-bar" style="width:${r.score/30*100}%"></div></div><span class="history-value">${r.score}問・${formatTime(r.time)}</span></div>`).join(''):'<div class="history-empty">次のチャレンジから記録がたまるよ</div>'}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function begin(){questions=shuffle(base.map(x=>({a:x[0],b:x[1]})));index=score=0;elapsed=0;locked=false;startedAt=Date.now();show('quiz');render();updateTimer();clearInterval(timerId);timerId=setInterval(()=>{elapsed=Math.floor((Date.now()-startedAt)/1000);updateTimer()},500)}
function render(){const q=questions[index];$('leftNum').textContent=q.a;$('product').textContent=q.a*q.b;$('counter').textContent=`${index+1} / 30`;$('barFill').style.width=`${index/30*100}%`;$('answer').value='';$('answer').className='answer';$('feedback').textContent='';$('feedback').className='feedback';locked=false;$('answer').focus()}
function updateTimer(){const m=Math.floor(elapsed/60),s=elapsed%60;$('timer').textContent=`${m}:${String(s).padStart(2,'0')}`}
function submit(){if(locked)return;const val=$('answer').value;if(val==='')return;locked=true;const ok=Number(val)===questions[index].b;if(ok){score++;$('answer').classList.add('correct');$('feedback').textContent=['その調子！','できた！','いいね！','正解！'][Math.floor(Math.random()*4)];$('feedback').className='feedback good'}else{$('answer').classList.add('wrong');$('feedback').textContent=`答えは ${questions[index].b}`;$('feedback').className='feedback bad'}setTimeout(()=>{index++;index>=30?finish(false):render()},ok?180:650)}
function finish(){clearInterval(timerId);const completed=Math.max(1,Math.round((Date.now()-startedAt)/1000)),qualified=score>=27;let n=passes();const oldHistory=history(),previous=oldHistory.length?oldHistory[oldHistory.length-1]:null,oldBest=bestRecord(oldHistory),total=totalPoints()+score;localStorage.setItem(storePrefix+'Points',String(total));const newHistory=[...oldHistory,{date:new Date().toISOString(),score,time:completed}];saveHistory(newHistory);const newBest=bestRecord(newHistory);if(!legacyBestSeconds()||completed<legacyBestSeconds())localStorage.setItem(storePrefix+'Best',String(completed));let gotBadge=false;if(qualified&&n<2){n++;setPasses(n);gotBadge=true}show('result');$('resultScore').textContent=`${score} / 30`;$('resultTime').textContent=`達成タイム　${formatTime(completed)}`;$('resultPoints').innerHTML=`<b>+${score} ポイント</b><span>累計 ${total} ポイント</span>`;const growth=[];if(!oldBest)growth.push('最初の記録ができたね！');else if(score>oldBest.score)growth.push(`最高正解数を ${score-oldBest.score}問 更新！`);else if(score===oldBest.score&&completed<oldBest.time)growth.push(`最高正解数をキープして ${oldBest.time-completed}秒 短縮！`);if(previous&&score>previous.score)growth.push(`前回より ${score-previous.score}問 アップ！`);else if(previous&&score===previous.score&&completed<previous.time)growth.push(`前回と同じ正解数で ${previous.time-completed}秒 短縮！`);const growthHtml=growth.length?`<div class="growth-note">${growth.join('<br>')}</div>`:'';if(qualified&&n>=2){$('resultIcon').textContent='🏆';$('resultTitle').textContent='STEP 1 クリア！';$('resultMsg').innerHTML=(gotBadge?'バッジを1こゲット！<br>':'27問以上、すばらしい！<br>')+'この調子で次へ進もう！'+growthHtml;confetti()}else if(qualified){$('resultIcon').textContent='🏅';$('resultTitle').textContent='27問以上達成！';$('resultMsg').innerHTML='バッジを1こゲット！<br>あと1回でSTEPクリア！'+growthHtml;confetti()}else{$('resultIcon').textContent=score>=24?'👍':'🌱';$('resultTitle').textContent='ポイントゲット！';$('resultMsg').innerHTML=`あと ${Math.max(0,27-score)}問でバッジ！<br>できる問題が少しずつ増えているよ。`+growthHtml}drawStamps('result')}
function put(n){if(locked)return;$('answer').value=String(n);$('answer').focus();if(n!=='')submit()}
document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>put(b.dataset.n)));
$('answer').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(-1);if(e.target.value)submit()});
$('clearBtn').onclick=()=>put('');$('clearHistoryBtn').onclick=()=>{if(confirm('このSTEPの記録をすべて消しますか？')){['Passes','Points','Best','History'].forEach(k=>localStorage.removeItem(storePrefix+k));updateHome()}};$('startBtn').onclick=begin;$('retryBtn').onclick=begin;$('homeBtn').onclick=()=>{show('start');updateHome()};updateHome();
function confetti(){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const p=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*5,r:3+Math.random()*6,a:Math.random()*6.28,col:['#e9a747','#6fa8d8','#8ac1e8','#ed6b6b','#9b68d5'][Math.floor(Math.random()*5)]}));let frames=0;(function draw(){x.clearRect(0,0,c.width,c.height);p.forEach(o=>{o.y+=o.v;o.x+=Math.sin(o.y/30);o.a+=.08;x.save();x.translate(o.x,o.y);x.rotate(o.a);x.fillStyle=o.col;x.fillRect(-o.r,-o.r,o.r*2,o.r);x.restore()});if(frames++<170)requestAnimationFrame(draw);else x.clearRect(0,0,c.width,c.height)})()}
})();
