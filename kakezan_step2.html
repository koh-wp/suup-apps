<section id="start" class="screen start active"><div class="message"><span>STEP2　3・4の段</span><strong>九九の答えをすばやく<br>正確に出そう！</strong></div><div class="start-stats"><div class="stat"><small>⭐ 累計正解ポイント</small><strong id="totalPoints">0</strong></div><div class="stat"><small>🎯 最高正解数</small><strong id="bestScore">-- / 30</strong></div></div><div class="badge-label">27問バッジ（2こでマスター）</div><div id="startStamps" class="stamps"></div><div class="modes"><button class="mode challenge" onclick="startGame()"><span>4つからえらぶ</span>30問チャレンジ</button></div><button class="records-btn" onclick="showRecords()">★ じぶんのきろく</button></section>
<section id="play" class="screen play"><div class="status"><span class="count"><b id="number">1</b><small id="total"> / 30</small></span><span id="timer" class="timer">⏱ 0:00</span><span class="score">正解 <b id="score">0</b></span></div><div class="progress"><i id="bar" class="bar"></i></div><div id="problem" class="problem"><span id="a"></span><span class="op">×</span><span id="b"></span><span class="op">＝</span><span class="answer"><b id="answer" hidden></b><i id="question">?</i></span><b id="feedback" class="feedback"></b></div><div id="choices" class="choices"></div><button class="menu-back" onclick="show('start')">← メニューにもどる</button></section>
<section id="result" class="screen result"><div class="burst">★</div><p class="finish">チャレンジ終了！</p><div class="result-score"><strong id="resultScore">0</strong><span> / 30 問</span></div><div id="resultTime" class="result-time"></div><div id="resultPoints" class="result-points"></div><h2 id="resultMessage"></h2><div id="growth" class="growth"></div><div id="resultStamps" class="stamps"></div><div class="actions"><button class="again" onclick="startGame()">もう一度 30問</button><button class="home" onclick="show('start')">はじめにもどる</button></div></section>
<section id="records" class="screen records"><div class="records-head"><p>できるようになったね！</p><h2>★ じぶんのきろく</h2></div><div class="summary"><div><small>最高正解数</small><strong id="recordBest">−</strong></div><div><small>最高記録のタイム</small><strong id="recordTime">−</strong></div><div><small>ちょうせん回数</small><strong id="attempts">0<em> 回</em></strong></div><div><small>累計ポイント</small><strong id="recordPoints">0</strong></div></div><h3>さいきんのきろく</h3><div id="history" class="history"></div><button class="clear-records" onclick="clearRecords()">記録を消す</button><button class="records-back" onclick="show('start')">← メニューにもどる</button></section>
</section></main>
<script>
const ORIGINAL=[[3,4],[4,7],[3,8],[4,3],[3,6],[4,9],[3,7],[4,6],[3,9],[4,8],[3,5],[4,4],[3,3],[4,5],[3,8],[4,7],[3,6],[4,9],[3,4],[4,8],[3,7],[4,6],[3,9],[4,3],[3,5],[4,4],[3,8],[4,5],[3,6],[4,7]];
let problems=[],index=0,correct=0,misses=[],answer='',mode='challenge',elapsed=0,startedAt=0,timerId=null,busy=false,recordable=true;
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),formatTime=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function loadHistory(){try{const h=JSON.parse(localStorage.getItem('kakezan-step2-history')||'[]');return Array.isArray(h)?h:[]}catch(e){return[]}}
function challengeHistory(){return loadHistory().filter(x=>x.mode==='challenge')}
function totalPoints(){const saved=localStorage.getItem('kakezan-step2-points');return saved===null?challengeHistory().reduce((n,x)=>n+(+x.score||0),0):+saved}
function passes(){const saved=localStorage.getItem('kakezan-step2-passes');return saved===null?Math.min(2,challengeHistory().filter(x=>+x.score>=27).length):Math.min(2,+saved||0)}
function bestRecord(h=challengeHistory()){return h.reduce((b,x)=>!b||+x.score>+b.score||(+x.score===+b.score&&x.time!=null&&(b.time==null||+x.time<+b.time))?x:b,null)}
function stamps(id){const n=passes();$(id).innerHTML=[1,2].map(i=>`<span class="stamp ${i<=n?'done':''}">${i<=n?'✓':i}</span>`).join('')}
function updateHome(){const b=bestRecord();$('totalPoints').textContent=totalPoints();$('bestScore').textContent=b?`${b.score} / 30`:'-- / 30';stamps('startStamps')}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');if(id!=='play')clearInterval(timerId);if(id==='start')updateHome()}
function choicesFor(p){const x=p[0]*p[1],c=[x,x-p[0],x+p[0],x-p[1],x+p[1],x-2,x+2,p[0]+p[1]].filter(n=>n>=0&&n<=100),u=[...new Set(c)];for(let n=0;u.length<4;n++)if(!u.includes(n))u.push(n);return shuffle(u.slice(0,4))}
function startGame(set=ORIGINAL){mode='challenge';recordable=set===ORIGINAL;problems=shuffle(set).map(p=>({a:p[0]??p.a,b:p[1]??p.b}));problems.forEach(p=>p.choices=choicesFor([p.a,p.b]));index=0;correct=0;misses=[];elapsed=0;startedAt=Date.now();busy=false;clearInterval(timerId);show('play');timerId=setInterval(()=>{elapsed=Math.floor((Date.now()-startedAt)/1000);renderTimer()},500);render()}
function render(){const p=problems[index];$('number').textContent=index+1;$('total').textContent=` / ${problems.length}`;$('score').textContent=correct;$('bar').style.width=`${index/problems.length*100}%`;$('a').textContent=p.a;$('b').textContent=p.b;clearAnswer();$('choices').innerHTML=p.choices.map(n=>`<button onclick="check(${n},this)">${n}</button>`).join('');renderTimer()}
function clearAnswer(){answer='';$('answer').hidden=true;$('question').hidden=false;$('feedback').textContent='';$('problem').className='problem'}
function showAnswer(v){$('answer').textContent=v;$('answer').hidden=false;$('question').hidden=true}
function nextProblem(delay){setTimeout(()=>{if(index+1>=problems.length)finish();else{index++;busy=false;render()}},delay)}
function check(v,btn){if(busy||v==='')return;answer=String(v);showAnswer(answer);const p=problems[index],right=p.a*p.b,ok=+v===right;busy=true;if(ok){correct++;$('score').textContent=correct;$('problem').className='problem correct';$('feedback').textContent='できた！';if(btn)btn.classList.add('correct');nextProblem(350);return}if(!misses.some(m=>m.a===p.a&&m.b===p.b))misses.push(p);$('problem').className='problem wrong';if(btn)btn.classList.add('wrong');$('answer').textContent=right;$('feedback').textContent=`答えは ${right}`;nextProblem(650)}
function makeKeypad(){$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')+`<button class="clear" onclick="key('clear')">けす</button><button class="zero" onclick="key('0')">0</button>`}
function key(v){if(busy)return;if(v==='clear'){clearAnswer();return}if(answer.length<2)answer+=v;if(answer)showAnswer(answer);const right=String(problems[index].a*problems[index].b);if(answer===right||!right.startsWith(answer)||answer.length>=right.length)check(answer)}
function renderTimer(){$('timer').textContent=`⏱ ${formatTime(elapsed)}`}
function saveRecord(completed){const all=loadHistory(),old=challengeHistory(),beforePoints=totalPoints(),beforePasses=passes(),previous=old[0]||null,oldBest=bestRecord(old),item={id:Date.now(),date:new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),mode:'challenge',score:correct,total:30,mistakes:misses.length,time:completed};all.unshift(item);localStorage.setItem('kakezan-step2-history',JSON.stringify(all.slice(0,100)));const points=beforePoints+correct;localStorage.setItem('kakezan-step2-points',String(points));let n=beforePasses,gotBadge=false;if(correct>=27&&n<2){n++;gotBadge=true;localStorage.setItem('kakezan-step2-passes',String(n))}const growth=[];if(!oldBest)growth.push('最初の記録ができたね！');else if(correct>+oldBest.score)growth.push(`最高正解数を ${correct-oldBest.score}問 更新！`);else if(correct===+oldBest.score&&oldBest.time!=null&&completed<+oldBest.time)growth.push(`最高正解数をキープして ${oldBest.time-completed}秒 短縮！`);if(previous&&correct>+previous.score)growth.push(`前回より ${correct-previous.score}問 アップ！`);else if(previous&&correct===+previous.score&&previous.time!=null&&completed<+previous.time)growth.push(`前回と同じ正解数で ${previous.time-completed}秒 短縮！`);return{points,n,gotBadge,growth}}
function finish(){if(!$('play').classList.contains('active'))return;clearInterval(timerId);elapsed=Math.max(1,Math.round((Date.now()-startedAt)/1000));show('result');$('resultScore').textContent=correct;$('resultTime').textContent=`達成タイム　${formatTime(elapsed)}`;const data=recordable?saveRecord(elapsed):null;$('resultPoints').hidden=!data;$('resultPoints').textContent=data?`+${correct}ポイント　累計 ${data.points}ポイント`:'';$('growth').innerHTML=data&&data.growth.length?data.growth.join('<br>'):'';stamps('resultStamps');if(correct>=27&&data&&data.n>=2)$('resultMessage').textContent='かけ算 STEP2 マスター合格！';else if(correct>=27)$('resultMessage').textContent='27問以上達成！ バッジをゲット！';else $('resultMessage').textContent=`あと ${27-correct}問でバッジ！`}
function showRecords(){const h=challengeHistory(),b=bestRecord(h);$('recordBest').innerHTML=b?`${b.score}<em> / 30</em>`:'−';$('recordTime').textContent=b&&b.time!=null?formatTime(+b.time):'−';$('attempts').innerHTML=`${h.length}<em> 回</em>`;$('recordPoints').textContent=totalPoints();$('history').innerHTML=h.length?h.slice(0,10).map(x=>`<div class="item"><div><b>30問チャレンジ</b><small>${x.date}</small></div><strong>${x.score}<small> / 30</small></strong><span>${x.time!=null?formatTime(+x.time):'旧記録'}</span></div>`).join(''):'<div class="empty">まだ記録はありません。<br>30問にちょうせんしてみよう！</div>';show('records')}
function clearRecords(){if(confirm('かけ算STEP2「3・4の段」の記録をすべて消しますか？')){['kakezan-step2-history','kakezan-step2-points','kakezan-step2-passes'].forEach(k=>localStorage.removeItem(k));showRecords()}}
updateHome();
</script>
</body></html>
