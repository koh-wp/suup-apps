:root{--cream:#fffdf6;--navy:#24476b;--blue:#8eb9e9;--pale:#edf6ff;--orange:#f5a343;--green:#35825f;--red:#cc5360}*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:"GenJyuuGothicX-Bold","Yu Gothic",Meiryo,sans-serif;font-weight:700;background-color:var(--cream);background-image:linear-gradient(to bottom,transparent 39px,rgba(139,188,233,.16) 40px);background-size:100% 40px}main{width:min(820px,100%);margin:auto;padding:22px}.head{text-align:center}.head h1{font-size:clamp(27px,5vw,38px);margin:0 0 5px;line-height:1.3}.head p{font-size:clamp(16px,3vw,20px);color:#527292;margin:0 0 20px}.status{display:flex;justify-content:space-between;font-size:18px;margin-bottom:8px}.track{height:11px;background:#dfebf8;border-radius:12px;overflow:hidden;margin-bottom:22px}.track span{display:block;height:100%;background:var(--orange);width:0;transition:width .2s}.prompt{text-align:center;font-size:clamp(18px,3.4vw,23px);margin:0 0 14px}.card{background:rgba(237,246,255,.94);border:2px dashed #b7d5fb;border-radius:20px;text-align:center;padding:clamp(18px,4vw,30px)}.label{font-size:15px;color:#63809c;margin:0 0 4px}.number{height:180px;display:flex;align-items:center;justify-content:center;gap:13px;background:#fff;border:2px solid var(--blue);border-radius:17px;padding:10px}.whole{font-size:clamp(48px,10vw,70px);line-height:1}.fraction{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:65px;font-size:clamp(39px,8vw,58px);line-height:1.05}.numerator{border-bottom:3px solid currentColor;min-width:100%;padding:0 8px 4px}.denominator{padding-top:4px}.question-help{font-size:15px;color:#557695;margin:14px 0 9px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{min-height:66px;background:#fff;border:2px solid var(--blue);border-radius:13px;color:var(--navy);font:700 clamp(17px,3vw,22px) "GenJyuuGothicX-Bold","Yu Gothic",Meiryo,sans-serif;padding:8px 6px;cursor:pointer}.choice.selected{border-color:var(--orange);background:#fff6e9;box-shadow:0 0 0 3px #fde3bf}.choice:disabled{cursor:default}.feedback{min-height:28px;text-align:center;font-size:17px;margin:12px 0 0}.feedback.good{color:var(--green)}.feedback.try{color:var(--red)}.hint{display:none;text-align:center;font-size:17px;line-height:1.6;color:#2e7454;background:#fff;border:1px solid #b7dfc9;border-radius:12px;padding:10px;margin:8px 0 0}.actions{text-align:center;margin:12px 0}.btn{font:700 19px "GenJyuuGothicX-Bold","Yu Gothic",Meiryo,sans-serif;color:#fff;background:#397dc7;border:0;border-radius:13px;padding:12px 30px;min-width:190px;box-shadow:0 3px 0 #235c99;cursor:pointer}.btn:focus-visible,.choice:focus-visible{outline:3px solid #ffc16e;outline-offset:2px}#next{display:none;background:#27815c;box-shadow:0 3px 0 #176244}.finish{display:none;text-align:center;background:rgba(237,246,255,.96);border:2px dashed #b7d5fb;border-radius:20px;padding:30px 16px}.finish h2{font-size:29px;margin:0 0 10px}.finish p{font-size:24px}.small{font-size:15px;color:#557695;margin:16px 0 0}@media(max-width:480px){main{padding:15px 10px 24px}.status{font-size:16px}.number{height:160px}.choices{gap:6px}.choice{font-size:clamp(15px,4vw,18px);min-height:70px;padding:6px 3px}}
</style></head><body><main><header class="head"><h1>分数の種類を見分けよう</h1><p>真分数・仮分数・帯分数を見分けよう。</p></header><section id="quiz"><div class="status"><span id="progress">1問目／10問</span><span id="score">正解 0問</span></div><div class="track"><span id="bar"></span></div><h2 class="prompt">この数は、どの分数ですか？</h2><article class="card"><p class="label">分数を見て選びましょう</p><div id="number" class="number" aria-label="問題の数"></div><p class="question-help">真分数・仮分数・帯分数から選んでください</p><div id="choices" class="choices"></div></article><p id="feedback" class="feedback" role="status" aria-live="polite"></p><p id="hint" class="hint" aria-live="polite"></p><div class="actions"><button id="check" class="btn" type="button">答え合わせ</button><button id="next" class="btn" type="button">次の問題へ</button></div></section><section id="finish" class="finish"><h2>よくがんばりました！</h2><p id="final"></p><button id="again" class="btn" type="button">もう一度チャレンジ</button><p class="small">問題の順番を入れ替えて、もう一度取り組めます。</p></section></main><script>
(()=>{'use strict';
const bank=[
 {w:1,n:3,d:4,t:'帯分数'},
 {w:2,n:1,d:3,t:'帯分数'},
 {n:7,d:8,t:'真分数'},
 {n:8,d:7,t:'仮分数'},
 {n:5,d:5,t:'仮分数'},
 {w:1,n:5,d:6,t:'帯分数'},
 {n:3,d:5,t:'真分数'},
 {n:7,d:6,t:'仮分数'},
 {n:4,d:9,t:'真分数'},
 {n:9,d:8,t:'仮分数'}
];const labels=['真分数','仮分数','帯分数'];const explain={真分数:'分子が分母より小さい分数です。',仮分数:'分子が分母と同じか、分母より大きい分数です。',帯分数:'整数と真分数を合わせた数です。'};const $=id=>document.getElementById(id);let questions=[],index=0,score=0,selected='',done=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showNumber(q){const box=$('number');box.replaceChildren();if(q.w){const w=document.createElement('span');w.className='whole';w.textContent=q.w;box.append(w)}const f=document.createElement('span');f.className='fraction';const n=document.createElement('span');n.className='numerator';n.textContent=q.n;const d=document.createElement('span');d.className='denominator';d.textContent=q.d;f.append(n,d);box.append(f)}
function render(){if(index>=questions.length){finish();return}const q=questions[index];selected='';done=false;$('progress').textContent=`${index+1}問目／10問`;$('score').textContent=`正解 ${score}問`;$('bar').style.width=`${index*10}%`;showNumber(q);$('choices').replaceChildren();labels.forEach(label=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=label;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{if(done)return;selected=label;$('choices').querySelectorAll('.choice').forEach(x=>{const on=x.textContent===label;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on?'true':'false')});$('feedback').textContent='';$('feedback').className='feedback'});$('choices').append(b)});$('feedback').textContent='';$('feedback').className='feedback';$('hint').style.display='none';$('hint').textContent='';$('check').style.display='inline-block';$('next').style.display='none';$('next').textContent=index===9?'結果を見る':'次の問題へ'}
function check(){if(done)return;if(!selected){$('feedback').className='feedback try';$('feedback').textContent='分数の種類を選んでください。';return}done=true;const q=questions[index];$('choices').querySelectorAll('.choice').forEach(b=>b.disabled=true);if(selected===q.t){score++;$('score').textContent=`正解 ${score}問`;$('bar').style.width=`${(index+1)*10}%`;$('feedback').className='feedback good';$('feedback').textContent='正解！';$('hint').textContent=explain[q.t];$('hint').style.display='block'}else{$('feedback').className='feedback try';$('feedback').textContent=`おしい！正解は「${q.t}」です。`;$('hint').textContent=explain[q.t];$('hint').style.display='block'}$('check').style.display='none';$('next').style.display='inline-block';$('next').focus()}
function finish(){$('quiz').style.display='none';$('finish').style.display='block';$('final').textContent=`正解 ${score}問／10問`}
function restart(){questions=shuffle(bank.slice());index=0;score=0;$('quiz').style.display='block';$('finish').style.display='none';render()}
$('check').addEventListener('click',check);$('next').addEventListener('click',()=>{if(done){index++;render()}});$('again').addEventListener('click',restart);document.addEventListener('keydown',e=>{if($('quiz').style.display==='none'||done)return;if(e.key==='1'||e.key==='2'||e.key==='3')$('choices').querySelectorAll('.choice')[Number(e.key)-1]?.click();if(e.key==='Enter'){e.preventDefault();check()}});restart();
})();</script></body></html>
