<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小数のしくみプラットフォーム 完全版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffdf6; --line:#cfe0ef; --margin:#f3b6b6; --ink:#3b5a73; --ink-soft:#5c7a90;
  --accent:#e3a857; --accent-deep:#c98a35; --blue:#8fb8de; --blue-deep:#5f93c4;
  --good:#6fbf8b; --card-radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0; padding:0; min-height:100%; font-family:'M PLUS Rounded 1c','Kosugi Maru','UD デジタル 教科書体 N-R','BIZ UDPGothic','Yu Gothic UI',sans-serif; font-weight:500; color:var(--ink);}
body{
  background-color:var(--paper);
  background-image:linear-gradient(90deg, transparent 0 56px, var(--margin) 56px 58px, transparent 58px 100%), linear-gradient(var(--paper) 0 31px, var(--line) 31px 32px);
  background-size:100% 100%, 100% 32px; background-attachment:fixed;
}
#menuScreen{min-height:100vh; padding:24px 16px 48px; display:flex; flex-direction:column; align-items:center;}
.app{width:100%; max-width:1060px;}
.app-header{text-align:center; margin-bottom:18px; padding-left:60px;}
.badge{display:inline-block; font-size:.9rem; font-weight:800; background:var(--accent); color:#fff; padding:5px 16px; border-radius:999px; letter-spacing:.05em; margin-bottom:8px; box-shadow:0 2px 0 var(--accent-deep);}
h1{font-size:clamp(2rem,5vw,3rem); font-weight:900; margin:0; letter-spacing:.06em; text-shadow:1px 1px 0 #fff;}
.subtitle{margin:8px 0 0; font-size:clamp(1.05rem,2.6vw,1.3rem); color:var(--ink-soft); font-weight:700;}
.main-card{background:#fffefb; border-radius:var(--card-radius); box-shadow:0 10px 0 -4px rgba(59,90,115,.06), 0 14px 30px rgba(59,90,115,.18); border:2px dashed var(--blue); padding:clamp(20px,4vw,36px); margin-left:44px;}
.lead{background:#f4f8fc; border-left:6px solid var(--blue-deep); border-radius:16px; padding:16px 20px; line-height:1.85; font-size:clamp(1rem,2.2vw,1.16rem); margin:0 0 22px;}
.lead strong{color:var(--accent-deep);}
.course-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.course-btn{
  appearance:none; border:3px solid var(--blue); background:#eef5fb; color:var(--ink); border-radius:20px;
  min-height:138px; padding:16px; text-align:left; cursor:pointer; font-family:inherit;
  box-shadow:0 5px 0 rgba(95,147,196,.55), 0 8px 14px rgba(59,90,115,.16);
  transition:transform .08s ease, background .15s ease, border-color .15s ease;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.course-btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(95,147,196,.55), 0 3px 8px rgba(59,90,115,.16);}
.course-btn:hover{background:#e5f1fb; border-color:var(--blue-deep);}
.course-num{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; background:var(--accent); color:white; font-weight:900; margin-bottom:10px; box-shadow:0 2px 0 var(--accent-deep);}
.course-title{display:block; font-size:clamp(1.05rem,2.3vw,1.28rem); font-weight:900; line-height:1.35; margin-bottom:4px;}
.course-sub{display:block; font-size:.95rem; font-weight:700; color:var(--ink-soft); line-height:1.45; margin-bottom:8px;}
.course-desc{display:block; font-size:.88rem; line-height:1.55; color:#6c8799;}

.perfect-board{
  background:#fff7e8;
  border:2px solid #f0dca8;
  border-radius:18px;
  padding:16px 18px;
  margin:0 0 22px;
}
.perfect-board h2{
  margin:0 0 6px;
  font-size:clamp(1.25rem,3vw,1.55rem);
  color:var(--accent-deep);
  letter-spacing:.04em;
}
.perfect-board .board-note{
  margin:0 0 14px;
  line-height:1.7;
  color:var(--ink);
  font-weight:700;
}
.check-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.check-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  background:#fffefb;
  border:2px solid #e4eef7;
  border-radius:14px;
  padding:8px 10px;
  min-height:48px;
  cursor:pointer;
  user-select:none;
}
.check-item input{
  width:20px;
  height:20px;
  margin-top:2px;
  accent-color:var(--good);
  flex:0 0 auto;
}
.check-item .check-title{
  font-weight:800;
  line-height:1.3;
  font-size:.98rem;
}
.check-item .check-title small{
  display:block;
  font-size:.82rem;
  font-weight:700;
  color:var(--ink-soft);
  margin-top:1px;
  line-height:1.3;
}
.check-item.done{
  background:#e9f8ee;
  border-color:var(--good);
}
.save-note-card{
  margin:8px 4px 0;
  color:var(--ink-soft);
  font-size:.82rem;
  font-weight:800;
  line-height:1.35;
  text-align:right;
}
.progress-summary{
  margin-top:12px;
  font-weight:800;
  color:var(--good-deep);
  text-align:center;
}
.reset-checks{
  display:block;
  margin:12px auto 0;
  border:none;
  border-radius:999px;
  background:#e7eef5;
  color:var(--ink-soft);
  font-family:inherit;
  font-weight:800;
  padding:8px 14px;
  cursor:pointer;
}
.course-btn.done{
  background:#e9f8ee;
  border-color:var(--good);
}
.course-btn.done .course-num{
  background:var(--good);
  box-shadow:0 2px 0 #4a9e68;
}
.perfect-stamp{
  display:inline-block;
  margin-top:4px;
  color:var(--good-deep);
  font-weight:900;
}
@media (max-width:980px){.check-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:700px){.check-grid{grid-template-columns:1fr;}}

.footer-note{text-align:center; color:#9fb2c2; font-size:.86rem; margin-top:22px;}
#appScreen{display:none; min-height:100vh;}
.topbar{height:64px; display:flex; align-items:center; gap:12px; padding:10px 16px; background:rgba(255,253,246,.96); border-bottom:2px solid #d7e7f4; position:sticky; top:0; z-index:10;}
.back-btn{font-family:inherit; font-weight:900; font-size:1rem; border:none; border-radius:14px; background:var(--accent-deep); color:white; padding:12px 18px; cursor:pointer; box-shadow:0 4px 0 #a46f28;}
.back-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #a46f28;}
.current-title{font-weight:900; font-size:clamp(1rem,2.6vw,1.25rem); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.current-title span{color:var(--ink-soft); font-weight:700; margin-left:8px;}
#appFrame{width:100%; height:calc(100vh - 64px); border:0; display:block; background:var(--paper);}
@media (max-width:860px){.course-grid{grid-template-columns:repeat(2,1fr);} .main-card{margin-left:0;} .app-header{padding-left:0;}}
@media (max-width:560px){.course-grid{grid-template-columns:1fr;} .course-btn{min-height:120px;} #menuScreen{padding:18px 12px 36px;} .topbar{height:70px; align-items:flex-start; flex-direction:column; gap:4px;} #appFrame{height:calc(100vh - 70px);}}
</style>
</head>
<body>
<div id="menuScreen">
  <main class="app">
    <header class="app-header">
      <span class="badge">小学4年生・算数</span>
      <h1>🔍 小数のしくみ</h1>
      <p class="subtitle">苦手なナゾをえらんでチャレンジしよう！</p>
    </header>
    <section class="main-card">
      <p class="lead">自分が練習したいコースを選びましょう。<br><strong>かんぺきをめざして、同じ問題にくりかえしチャレンジしましょう。</strong></p>
      <section class="perfect-board" aria-label="かんぺきチェックひょう">
        <h2>🌟 かんぺきチェックひょう</h2>
        <p class="board-note">全部のコースをかんぺきにしよう！<br>全部かんぺきになったら、チェックをリセットして、もう一度チャレンジしよう。もっともっとかんぺきになれるよ！</p>
        <div class="check-grid" id="checkGrid"></div>
        <div class="save-note-card">チェックはこのタブレットだけに保存されます。</div>
        <div class="progress-summary" id="progressSummary">0 / 13 コース かんぺき</div>
        <button class="reset-checks" id="resetChecks" type="button">チェックをリセット</button>
      </section>
      <div class="course-grid" id="courseGrid"></div>
    </section>
    <p class="footer-note">このファイル1つで使えます。Googleドライブで配布するときは、このHTMLだけを配れば大丈夫です。</p>
  </main>
</div>
<div id="appScreen">
  <div class="topbar">
    <button class="back-btn" id="backBtn">← コースをえらぶ</button>
    <div class="current-title" id="currentTitle"></div>
  </div>
  <iframe id="appFrame" title="問題アプリ"></iframe>
</div>

const grid = document.getElementById('courseGrid');
const checkGrid = document.getElementById('checkGrid');
const progressSummary = document.getElementById('progressSummary');
const resetChecksBtn = document.getElementById('resetChecks');
const PERFECT_KEY = 'shosu_no_shikumi_perfect_checks_v3';
function loadPerfectChecks(){
  try{
    return JSON.parse(localStorage.getItem(PERFECT_KEY)) || {};
  }catch(e){ return {}; }
}
function savePerfectChecks(data){
  localStorage.setItem(PERFECT_KEY, JSON.stringify(data));
}
let perfectChecks = loadPerfectChecks();
const menuScreen = document.getElementById('menuScreen');
const appScreen = document.getElementById('appScreen');
const frame = document.getElementById('appFrame');
const currentTitle = document.getElementById('currentTitle');
function decodeBase64Utf8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function openApp(index){
  const app = APPS[index];
  currentTitle.innerHTML = app.num + ' ' + app.title + '<span>' + app.subtitle + '</span>';
  frame.srcdoc = decodeBase64Utf8(app.b64);
  menuScreen.style.display = 'none';
  appScreen.style.display = 'block';
  window.scrollTo(0,0);
}
function backToMenu(){
  frame.srcdoc = '';
  appScreen.style.display = 'none';
  menuScreen.style.display = 'flex';
  currentTitle.textContent = '';
  window.scrollTo(0,0);
}
function updatePerfectDisplay(){
  let count = 0;
  APPS.forEach(app => { if(!!perfectChecks[app.num]) count++; });
  progressSummary.textContent = `${count} / ${APPS.length} コース かんぺき`;

  document.querySelectorAll('.check-item').forEach(item => {
    const num = item.dataset.num;
    const checked = !!perfectChecks[num];
    item.classList.toggle('done', checked);
    const input = item.querySelector('input');
    if(input) input.checked = checked;
  });

  document.querySelectorAll('.course-btn').forEach(btn => {
    const num = btn.dataset.num;
    const checked = !!perfectChecks[num];
    btn.classList.toggle('done', checked);
    const stamp = btn.querySelector('.perfect-stamp');
    if(stamp) stamp.style.display = checked ? 'inline-block' : 'none';
  });
}
APPS.forEach((app, i)=>{
  const checkLabel = document.createElement('label');
  checkLabel.className = 'check-item';
  checkLabel.dataset.num = app.num;
  checkLabel.innerHTML = `<input type="checkbox" aria-label="${app.title}をかんぺきにする"><span class="check-title">${app.num} ${app.title}<small>${app.subtitle}</small></span>`;
  const checkInput = checkLabel.querySelector('input');
  checkInput.addEventListener('change', () => {
    perfectChecks[app.num] = checkInput.checked;
    if(!checkInput.checked) delete perfectChecks[app.num];
    savePerfectChecks(perfectChecks);
    updatePerfectDisplay();
  });
  checkGrid.appendChild(checkLabel);

  const btn = document.createElement('button');
  btn.className = 'course-btn';
  btn.dataset.num = app.num;
  btn.innerHTML = `<span class="course-num">${app.num}</span><span class="course-title">${app.title}</span><span class="course-sub">${app.subtitle}</span><span class="course-desc">${app.desc}</span><span class="perfect-stamp" style="display:none;">✓ かんぺき</span>`;
  btn.addEventListener('click', ()=>openApp(i));
  grid.appendChild(btn);
});


resetChecksBtn.addEventListener('click', () => {
  if(confirm('かんぺきチェックをすべて消しますか？')){
    perfectChecks = {};
    savePerfectChecks(perfectChecks);
    updatePerfectDisplay();
  }
});

updatePerfectDisplay();
document.getElementById('backBtn').addEventListener('click', backToMenu);
</script>
</body>
</html>
